<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Memories About Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#2a2950;--deep:#1b1a3a;--blush:#eddbd8;--wax:#6a0f1a;--script:'Great Vibes',cursive;--serif:'Cormorant Garamond',serif;--caps:'Cinzel',serif}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{margin:0;min-height:100%;background:#272650} body{color:var(--blush);font-family:var(--serif);overflow:hidden}
    button{font:inherit} .screen{position:fixed;inset:0;padding:env(safe-area-inset-top) max(20px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(20px,env(safe-area-inset-left));display:grid;place-items:center;transition:opacity .5s ease;z-index:10}.screen.gone{opacity:0;pointer-events:none}
    /* lock */ #lock{background:#272650;text-align:center}.lock-inner{display:grid;justify-items:center;gap:22px}.lock-inner h1{font:400 clamp(48px,14vw,70px)/.95 var(--script);margin:0}.lock-inner p{font-size:20px;margin:-7px 0 0}.dots{display:flex;gap:14px;height:15px}.dots i{width:12px;height:12px;border:1.5px solid var(--blush);border-radius:50%;transition:background .16s}.dots i.on{background:var(--blush)}.keypad{display:grid;grid-template-columns:repeat(3,70px);gap:13px}.key{height:70px;border:1px solid #eddbd880;border-radius:50%;background:transparent;color:var(--blush);font-size:27px;cursor:pointer}.key:active{transform:scale(.93);background:#eddbd820}.key.back{font-size:22px}.shake{animation:shake .45s}@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
    #memories{position:fixed;inset:0;z-index:20;overflow:auto;color:var(--navy);background:var(--blush);padding:calc(26px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));scroll-behavior:smooth}
    .song-card{background:var(--navy);color:var(--blush);border-radius:22px;padding:13px;max-width:500px;margin:0 auto 42px;box-shadow:0 8px 24px #1b1a3a35}.feature-img{width:100%;aspect-ratio:1.55;object-fit:cover;border-radius:14px;display:block}.song-meta{padding:12px 5px 6px}.song-meta small{font:500 10px var(--caps);letter-spacing:1.4px;opacity:.7}.song-meta h2{font:500 25px/1.1 var(--serif);margin:3px 0}.voice-controls{display:flex;align-items:center;gap:12px;padding:3px 5px 5px}.play{flex:0 0 44px;height:44px;border:0;border-radius:50%;background:var(--wax);color:#fff;cursor:pointer;font-size:15px}.wave{height:30px;display:flex;gap:3px;align-items:center;flex:1}.wave i{width:3px;height:var(--h);background:#eddbd8;border-radius:5px;opacity:.78;animation:wave .8s ease-in-out infinite alternate;animation-delay:var(--d)}.wave.paused i{animation-play-state:paused}@keyframes wave{to{transform:scaleY(.35)}}
    .playlist{max-width:560px;margin:0 auto 45px}.section-title{text-align:center;font:400 clamp(43px,13vw,62px)/1 var(--script);margin:0 0 15px}.playlist-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.mini{min-width:0;background:#fff8edaa;border:1px solid #2a295022;border-radius:12px;padding:7px;box-shadow:0 3px 8px #2a295018}.mini img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}.mini h3{font:600 10px/1.05 var(--serif);margin:6px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progress{height:2px;background:#2a295040}.progress i{display:block;width:var(--p);height:100%;background:var(--wax)}.mini-controls{display:flex;justify-content:space-between;font:12px sans-serif;margin-top:5px;color:var(--navy)}
    .gallery{background:var(--navy);color:var(--blush);margin:0 calc(-1 * max(20px,env(safe-area-inset-right))) calc(-40px - env(safe-area-inset-bottom)) calc(-1 * max(20px,env(safe-area-inset-left)));padding:42px max(20px,env(safe-area-inset-right)) calc(34px + env(safe-area-inset-bottom))}.gallery-copy{text-align:center;max-width:500px;margin:auto}.quote{font:400 clamp(31px,10vw,48px)/.95 var(--script);margin:0}.gallery-copy p{font-size:18px;margin:12px 0 24px}.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 0 10px}.strip button{flex:0 0 70%;padding:0;border:0;border-radius:13px;overflow:hidden;scroll-snap-align:center;background:none;cursor:pointer}.strip img{display:block;width:100%;aspect-ratio:.75;object-fit:cover}.lightbox{position:fixed;inset:0;background:#0c0b20ee;z-index:50;display:none;place-items:center;padding:25px}.lightbox.show{display:grid}.lightbox img{max-width:100%;max-height:86dvh;object-fit:contain}.close-lightbox{position:absolute;right:20px;top:calc(18px + env(safe-area-inset-top));border:0;background:transparent;color:white;font-size:38px;cursor:pointer}
    @media (min-width:650px){.strip button{flex-basis:32%}.playlist-grid{gap:13px}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main id="lock" class="screen"><div class="lock-inner"><h1>For us</h1><p>Enter our little secret</p><div class="dots" aria-label="password"><i></i><i></i><i></i><i></i></div><div class="keypad" id="keypad"></div></div></main>
  <article id="memories" hidden><section class="song-card"><img class="feature-img" src="images/dance.jpg" alt="A shared dance memory"><div class="song-meta"><small>OUR SONG</small><h2>Cairokee - Fel Khetam</h2></div><div class="voice-controls"><button class="play" id="play" aria-label="Play voice note">▶</button><div class="wave paused" id="wave" aria-hidden="true"><i style="--h:14px;--d:.1s"></i><i style="--h:25px;--d:.4s"></i><i style="--h:18px;--d:.2s"></i><i style="--h:30px;--d:.5s"></i><i style="--h:13px;--d:.3s"></i><i style="--h:22px;--d:.6s"></i><i style="--h:28px;--d:.1s"></i><i style="--h:17px;--d:.45s"></i><i style="--h:24px;--d:.2s"></i><i style="--h:12px;--d:.5s"></i><i style="--h:27px;--d:.3s"></i></div><audio id="audio" preload="metadata"></audio></div></section><section class="playlist"><h2 class="section-title">Our playlist</h2><div class="playlist-grid" id="playlist-grid"></div></section><section class="gallery"><div class="gallery-copy"><h2 class="quote">Every picture holds a memory, and every memory tells our story.</h2><p>Tap each photo to relive the moment.</p></div><div class="strip" id="photo-strip"></div></section></article>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer"><button class="close-lightbox" aria-label="Close photo">×</button><img src="" alt="Memory"></div>
  <script>
    const PASSWORD = "1234";
    const AUDIO_SRC = "";

    const $=id=>document.getElementById(id);
    let entered=''; const keypad=$('keypad');
    [...'123456789'].forEach(n=>keypad.insertAdjacentHTML('beforeend',`<button class="key" data-key="${n}">${n}</button>`));
    keypad.insertAdjacentHTML('beforeend','<span></span><button class="key" data-key="0">0</button><button class="key back" data-key="back" aria-label="Delete">⌫</button>');
    function paintDots(){document.querySelectorAll('.dots i').forEach((dot,i)=>dot.classList.toggle('on',i<entered.length))}
    function addKey(key){if(key==='back')entered=entered.slice(0,-1);else if(entered.length<4)entered+=key;paintDots();if(entered.length===4){if(entered===PASSWORD){setTimeout(unlock,180)}else{$('lock').classList.remove('shake');void $('lock').offsetWidth;$('lock').classList.add('shake');setTimeout(()=>{entered='';paintDots()},460)}}}
    keypad.addEventListener('click',e=>{const key=e.target.dataset.key;if(key)addKey(key)});
    function unlock(){$('lock').classList.add('gone');$('memories').hidden=false}
    const photos=['hugnight','hugnight','laugh','sea','flowers','sil','flowers','sea','hugnight'];const titles=['A warm night','Stay close','Laugh louder','Blue hour','Just because','Soft things','A little bloom','By the sea','Us, always'];
    $('playlist-grid').innerHTML=photos.map((p,i)=>`<div class="mini"><img src="images/${p}.jpg" alt="${titles[i]}"><h3>${titles[i]}</h3><div class="progress"><i style="--p:${25+i*7}%"></i></div><div class="mini-controls"><span>‹</span><span>Ⅱ</span><span>›</span></div></div>`).join('');
    const gallery=['sil','hugnight','laugh','sea','flowers','dance2','dance'];$('photo-strip').innerHTML=gallery.map((p,i)=>`<button data-photo="images/${p}.jpg" aria-label="Open memory ${i+1}"><img src="images/${p}.jpg" alt="A memory together"></button>`).join('');
    $('photo-strip').addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;$('lightbox').querySelector('img').src=btn.dataset.photo;$('lightbox').classList.add('show')});$('lightbox').addEventListener('click',e=>{if(e.target===$('lightbox')||e.target.closest('button'))$('lightbox').classList.remove('show')});
    const audio=$('audio'),play=$('play');audio.src=AUDIO_SRC;play.addEventListener('click',()=>{if(!AUDIO_SRC){play.textContent='♪';return}audio.paused?audio.play():audio.pause()});audio.addEventListener('play',()=>{play.textContent='Ⅱ';$('wave').classList.remove('paused')});audio.addEventListener('pause',()=>{play.textContent='▶';$('wave').classList.add('paused')});
  </script>
</body>
</html>
