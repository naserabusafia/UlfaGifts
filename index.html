  <article id="memories" hidden><section class="song-card"><img class="feature-img" src="images/dance.jpg" alt="A shared dance memory"><div class="song-meta"><small>OUR SONG</small><h2>Cairokee - Fel Khetam</h2></div><div class="voice-controls"><button class="play" id="play" aria-label="Play voice note">▶</button><div class="wave paused" id="wave" aria-hidden="true"><i style="--h:14px;--d:.1s"></i><i style="--h:25px;--d:.4s"></i><i style="--h:18px;--d:.2s"></i><i style="--h:30px;--d:.5s"></i><i style="--h:13px;--d:.3s"></i><i style="--h:22px;--d:.6s"></i><i style="--h:28px;--d:.1s"></i><i style="--h:17px;--d:.45s"></i><i style="--h:24px;--d:.2s"></i><i style="--h:12px;--d:.5s"></i><i style="--h:27px;--d:.3s"></i></div><audio id="audio" preload="metadata"></audio></div></section><section class="playlist"><h2 class="section-title">Our playlist</h2><div class="playlist-grid" id="playlist-grid"></div></section><section class="gallery"><div class="gallery-copy"><h2 class="quote">Every picture holds a memory, and every memory tells our story.</h2><p>Tap each photo to relive the moment.</p></div><div class="strip" id="photo-strip"></div></section></article>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer"><button class="close-lightbox" aria-label="Close photo">×</button><img src="" alt="Memory"></div>
  <script>
    const PASSWORD = "1234";
    const AUDIO_SRC = "";

    const $=id=>document.getElementById(id);
    let entered=''; const keypad=$('keypad');
    [...'123456789'].forEach(n=>keypad.insertAdjacentHTML('beforeend',`<button class="key" data-key="${n}">${n}</button>`));
    keypad.insertAdjacentHTML('beforeend','<span></span><button class="key" data-key="0">0</button><button class="key back" data-key="back" aria-label="Delete">⌫</button>');
    function paintDots(){document.querySelectorAll('.dots i').forEach((dot,i)=>dot.classList.toggle('on',i<entered.length))}
    function addKey(key){if(key==='back')entered=entered.slice(0,-1);else if(entered.length<4)entered+=key;paintDots();if(entered.length===4){if(entered===PASSWORD){setTimeout(unlock,180)}else{$('lock').classList.remove('shake');void $('lock').offsetWidth;$('lock').classList.add('shake');setTimeout(()=>{entered='';paintDots()},460)}}}
    keypad.addEventListener('click',e=>{const key=e.target.dataset.key;if(key)addKey(key)});
    function unlock(){$('lock').classList.add('gone');$('memories').hidden=false}
    const photos=['hugnight','hugnight','laugh','sea','flowers','sil','flowers','sea','hugnight'];const titles=['A warm night','Stay close','Laugh louder','Blue hour','Just because','Soft things','A little bloom','By the sea','Us, always'];
    $('playlist-grid').innerHTML=photos.map((p,i)=>`<div class="mini"><img src="images/${p}.jpg" alt="${titles[i]}"><h3>${titles[i]}</h3><div class="progress"><i style="--p:${25+i*7}%"></i></div><div class="mini-controls"><span>‹</span><span>Ⅱ</span><span>›</span></div></div>`).join('');
    const gallery=['sil','hugnight','laugh','sea','flowers','dance2','dance'];$('photo-strip').innerHTML=gallery.map((p,i)=>`<button data-photo="images/${p}.jpg" aria-label="Open memory ${i+1}"><img src="images/${p}.jpg" alt="A memory together"></button>`).join('');
    $('photo-strip').addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;$('lightbox').querySelector('img').src=btn.dataset.photo;$('lightbox').classList.add('show')});$('lightbox').addEventListener('click',e=>{if(e.target===$('lightbox')||e.target.closest('button'))$('lightbox').classList.remove('show')});
    const audio=$('audio'),play=$('play');audio.src=AUDIO_SRC;play.addEventListener('click',()=>{if(!AUDIO_SRC){play.textContent='♪';return}audio.paused?audio.play():audio.pause()});audio.addEventListener('play',()=>{play.textContent='Ⅱ';$('wave').classList.remove('paused')});audio.addEventListener('pause',()=>{play.textContent='▶';$('wave').classList.add('paused')});

    /* loader: hide once fonts + images are ready (min ~0.9s so it never flashes, max 3s safety) */
    (function(){
      const t0=performance.now(),MIN=900,MAX=3000;
      const imgs=[...document.images].map(i=>i.complete?Promise.resolve():new Promise(r=>{i.onload=i.onerror=r}));
      const fonts=(document.fonts&&document.fonts.ready)||Promise.resolve();
      const ready=Promise.all([fonts,...imgs]);
      const hide=()=>{const l=document.getElementById('loader');l.classList.add('done');setTimeout(()=>l.remove(),600)};
      Promise.race([ready,new Promise(r=>setTimeout(r,MAX))]).then(()=>setTimeout(hide,Math.max(0,MIN-(performance.now()-t0))));
    })();
  </script>
</body>
</html>
